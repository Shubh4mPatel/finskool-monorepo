# Deploys to the production server on every push to main.
#
# The runner SSHes into the server, resets the server's clone of this repo to
# the pushed commit, then runs docker/deploy.sh — which diffs against the last
# successfully deployed commit and rebuilds/restarts only what changed
# (backend, frontend, nginx, or the whole stack if the compose file changed).
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   SSH_HOST         server hostname or IP
#   SSH_USER         SSH user (must be able to run `docker`)
#   SSH_KEY          private key whose public half is in the user's authorized_keys
#   DEPLOY_PATH      absolute path of the repo clone on the server
# Optional:
#   SSH_PORT         defaults to 22

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_all:
        description: Rebuild and recreate every service
        type: boolean
        default: false

# Never run two deploys against the same server at once; a newer push waits
# for the running one instead of cancelling it mid-build.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check required secrets
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          missing=0
          for name in SSH_HOST SSH_USER SSH_KEY DEPLOY_PATH; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret $name is not set (Settings → Secrets and variables → Actions → Secrets tab)."
              missing=1
            fi
          done
          exit $missing

      # Plain OpenSSH, not a marketplace action: appleboy/ssh-action downloads its drone-ssh binary from GitHub
      # Releases on every run, and a GitHub 504 there failed the deploy before it even connected.
      - name: Deploy over SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_SHA: ${{ github.sha }}
          FORCE_ALL: ${{ github.event.inputs.force_all == 'true' && '1' || '0' }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # The long docker build prints nothing for minutes: keep-alives stop the connection being dropped.
          # accept-new trusts the server's key on first contact and refuses it if it later changes.
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" \
            -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
            "$SSH_USER@$SSH_HOST" \
            "DEPLOY_PATH=$(printf '%q' "$DEPLOY_PATH") DEPLOY_SHA=$(printf '%q' "$DEPLOY_SHA") FORCE_ALL=$(printf '%q' "$FORCE_ALL") bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$DEPLOY_PATH"
          git fetch --prune origin main
          git reset --hard "$DEPLOY_SHA"
          FORCE_ALL="$FORCE_ALL" bash docker/deploy.sh
          REMOTE

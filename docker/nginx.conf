server {
    listen 80;
    server_name _;

    client_max_body_size 50M;

    # Backend API
    location /api/ {
        proxy_pass         http://finskool-backend:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 60s;
    }

    # Live WebSocket feeds (stock prices + notifications) — these are backend
    # routes (see live-stock-feed.ts / live-notifications-feed.ts), not Next.js
    # ones, so without this block they'd fall through to the frontend location
    # below and the upgrade would fail against a server that doesn't handle them.
    location /ws/ {
        proxy_pass         http://finskool-backend:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        # Long-lived connections — the default 60s read timeout would kill an
        # idle-but-open WebSocket well before the client's own reconnect logic
        # ever kicks in.
        proxy_read_timeout 3600s;
    }

    # Frontend (Next.js)
    location / {
        proxy_pass         http://finskool-frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
    }
}

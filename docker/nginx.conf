# Plain HTTP on :80 inside the container. It sits behind eqlion-nginx, which owns
# the host's 80/443 and terminates TLS (see the nginx service's `ports:` in
# docker-compose.production.yml) — so no certbot/443 setup in this file.

# Keep the outer proxy's X-Forwarded-Proto (https) instead of overwriting it with
# this hop's own scheme (always http); fall back to $scheme when hit directly.
map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# The path (and query string) after /assets/, exactly as the client sent it. MinIO checks the signature of a presigned
# link against that exact text, so it is passed on untouched instead of being decoded and encoded again.
map $request_uri $minio_path {
    ~^/assets/(?<rest>.*)$ $rest;
    default                "";
}

# Which maintenance file to send: a JSON body for the API and WebSocket routes (the mobile app reads it), the
# friendly HTML page for everything else.
map $request_uri $maintenance_file {
    ~^/(api|ws)/ /maintenance.json;
    default      /maintenance.html;
}

server {
    listen 80;
    server_name community.finskool21.in;

    # Look the other containers up again every few seconds (Docker's built-in DNS), instead of once when nginx
    # starts. A container that is restarted or recreated gets a new address; with the old behaviour nginx kept calling
    # the dead one and answered 502 ("Bad Gateway") until nginx itself was restarted. The upstream names are held in
    # variables below because nginx only uses `resolver` for names that are variables. A side effect: nginx now starts
    # even when a container is not up yet, instead of refusing with "host not found in upstream".
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $minio_host    minio;
    set $backend_host  finskool-backend;
    set $frontend_host finskool-frontend;

    client_max_body_size 50M;

    # Maintenance mode. docker/deploy.sh creates docker/maintenance/ON when a deploy starts and removes it once the new
    # backend and frontend are built and running (docker/maintenance.sh does the same by hand). While the file exists
    # every request gets HTTP 503 and the page below. The file is checked on every request, so switching it on or off
    # needs no nginx reload.
    if (-f /etc/nginx/maintenance/ON) {
        return 503;
    }
    error_page 503 @maintenance;
    location @maintenance {
        root /etc/nginx/maintenance;
        rewrite ^ $maintenance_file break;
        # 503 + Retry-After tells crawlers and apps to come back later; no-store keeps browsers and CDNs from
        # holding on to the page after the site is live again.
        add_header Retry-After 60 always;
        add_header Cache-Control "no-store" always;
    }

    # MinIO file storage, reverse-proxied under the site's own domain instead of a
    # separate host/port — the /assets/ prefix is cut off ($minio_path above), so MinIO sees the
    # plain /{bucket}/{object} path it originally signed.
    # See the toPublicUrl comment in apps/backend/src/lib/minio.ts for the signing side.
    location /assets/ {
        # Post videos are PUT straight here via presigned URLs (up to MAX_VIDEO_BYTES in
        # apps/backend/src/lib/minio.ts) — keep this at or above that limit, and no higher
        # than the 50m EqLion's nginx allows for this domain (finskool-locations.inc there).
        client_max_body_size 50M;
        proxy_request_buffering off;
        # Uploaded files are served from the app's own origin — never let a browser sniff one
        # into something executable (e.g. HTML hiding behind an image/PDF extension).
        add_header         X-Content-Type-Options nosniff always;
        proxy_pass         http://$minio_host:9000/$minio_path;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $fwd_proto;
    }

    # Backend API
    location /api/ {
        proxy_pass         http://$backend_host:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $fwd_proto;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 60s;
    }

    # Live WebSocket feeds (stock prices + notifications) — these are backend
    # routes (see live-stock-feed.ts / live-notifications-feed.ts), not Next.js
    # ones, so without this block they'd fall through to the frontend location
    # below and the upgrade would fail against a server that doesn't handle them.
    location /ws/ {
        proxy_pass         http://$backend_host:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $fwd_proto;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        # Long-lived connections — the default 60s read timeout would kill an
        # idle-but-open WebSocket well before the client's own reconnect logic
        # ever kicks in.
        proxy_read_timeout 3600s;
    }

    # Frontend (Next.js)
    location / {
        proxy_pass         http://$frontend_host:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $fwd_proto;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
    }
}

# TLS is terminated upstream by the box-wide Traefik instance, not here — this container
# only ever speaks plain HTTP on :80, reached over the internal root_default Docker network
# (see the nginx service's labels/networks in docker-compose.production.yml). Traefik
# handles the community.finskool21.in Let's Encrypt cert itself (TLS-ALPN-01), so there's
# no certbot setup or 443 listener in this file.
server {
    listen 80;
    server_name community.finskool21.in;

    client_max_body_size 50M;

    # MinIO file storage, reverse-proxied under the site's own domain instead of a
    # separate host/port — trailing slash on proxy_pass strips the /assets/ prefix before
    # forwarding, so MinIO sees the plain /{bucket}/{object} path it originally signed.
    # See the toPublicUrl comment in apps/backend/src/lib/minio.ts for the signing side.
    location /assets/ {
        proxy_pass         http://minio:9000/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Backend API
    location /api/ {
        proxy_pass         http://finskool-backend:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 60s;
    }

    # Live WebSocket feeds (stock prices + notifications) — these are backend
    # routes (see live-stock-feed.ts / live-notifications-feed.ts), not Next.js
    # ones, so without this block they'd fall through to the frontend location
    # below and the upgrade would fail against a server that doesn't handle them.
    location /ws/ {
        proxy_pass         http://finskool-backend:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        # Long-lived connections — the default 60s read timeout would kill an
        # idle-but-open WebSocket well before the client's own reconnect logic
        # ever kicks in.
        proxy_read_timeout 3600s;
    }

    # Frontend (Next.js)
    location / {
        proxy_pass         http://finskool-frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
    }
}

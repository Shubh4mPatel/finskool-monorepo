# HTTPS: this image is plain nginx:alpine (no certbot installed), so certs are obtained
# via a separate `certbot/certbot` container running `certonly --webroot -w /var/www/certbot
# -d community.finskool21.in` against the /.well-known/acme-challenge/ location below — see
# docker-compose.production.yml for the certbot service and shared volumes. Once a cert
# exists at /etc/letsencrypt/live/community.finskool21.in/, add a second `listen 443 ssl`
# server block here (fullchain.pem / privkey.pem, mounted read-only from the same volume)
# and reload nginx. Until then this file must only listen on 80 — a 443 block referencing
# certs that don't exist yet would fail to start.
server {
    listen 80;
    server_name community.finskool21.in;

    client_max_body_size 50M;

    # Certbot's HTTP-01 challenge (webroot method) — must stay reachable on plain :80 even
    # after HTTPS is enabled, since cert renewal re-validates the same way.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # MinIO file storage, reverse-proxied under the site's own domain instead of a
    # separate host/port — trailing slash on proxy_pass strips the /assets/ prefix before
    # forwarding, so MinIO sees the plain /{bucket}/{object} path it originally signed.
    # See the toPublicUrl comment in apps/backend/src/lib/minio.ts for the signing side.
    location /assets/ {
        proxy_pass         http://minio:9000/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Backend API
    location /api/ {
        proxy_pass         http://finskool-backend:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 60s;
    }

    # Live WebSocket feeds (stock prices + notifications) — these are backend
    # routes (see live-stock-feed.ts / live-notifications-feed.ts), not Next.js
    # ones, so without this block they'd fall through to the frontend location
    # below and the upgrade would fail against a server that doesn't handle them.
    location /ws/ {
        proxy_pass         http://finskool-backend:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        # Long-lived connections — the default 60s read timeout would kill an
        # idle-but-open WebSocket well before the client's own reconnect logic
        # ever kicks in.
        proxy_read_timeout 3600s;
    }

    # Frontend (Next.js)
    location / {
        proxy_pass         http://finskool-frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
    }
}

# Production stack — runs on VPS behind this project's own internal Nginx, which in turn
# sits behind the box-wide Traefik instance (/root/docker-compose.yml) that owns host ports
# 80/443 for every site on this server. We don't bind 80/443 or run our own certbot here —
# Traefik does host-based routing + Let's Encrypt (TLS-ALPN-01, no webroot needed) via the
# labels on the nginx service below, same pattern as the other sites on this box.
# All environment is driven by apps/backend/.env
#
#   docker compose -f docker/docker-compose.production.yml up -d --build
#
# Site is routed at https://community.finskool21.in — see apps/backend/.env.example for
# CORS_ORIGIN/FRONTEND_URL/MINIO_PUBLIC_*.

services:

  # ── Nginx reverse proxy ────────────────────────────────────────────────────
  # No ports: published — Traefik reaches this container over the shared root_default
  # network (see `networks:` below) and forwards to its internal port 80 (see the
  # traefik.http.services...loadbalancer.server.port label).
  nginx:
    image: nginx:alpine
    container_name: finskool-nginx
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - default
      - traefik-public
    labels:
      - traefik.enable=true
      - traefik.http.routers.finskool.rule=Host(`community.finskool21.in`)
      - traefik.http.routers.finskool.entrypoints=web,websecure
      - traefik.http.routers.finskool.tls=true
      - traefik.http.routers.finskool.tls.certresolver=mytlschallenge
      - traefik.http.services.finskool.loadbalancer.server.port=80
      - traefik.docker.network=root_default
    depends_on:
      finskool-backend:
        condition: service_healthy
      finskool-frontend:
        condition: service_started

  # ── Backend ────────────────────────────────────────────────────────────────
  finskool-backend:
    build:
      context: ../apps/backend
      dockerfile: Dockerfile
    image: finskool-backend:latest
    container_name: finskool-backend
    restart: unless-stopped
    env_file:
      - ../apps/backend/.env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      # Browser-facing MinIO URLs go through nginx's /assets/ prefix on the same domain
      # (see docker/nginx.conf), so these match CORS_ORIGIN/FRONTEND_URL, not a MinIO port.
      MINIO_PUBLIC_PORT: "443"
      MINIO_PUBLIC_USE_SSL: "true"
      # MINIO_PUBLIC_ENDPOINT comes from .env (env_file above) — see .env.example.
      # SMTP_HOST/PORT/USER/PASSWORD/FROM are NOT overridden here — they come
      # straight from .env (env_file above), so you can point production at
      # a real relay (Gmail/SES/SendGrid/etc.) or at the mailhog service below
      # just by editing .env, with no compose file changes needed.
    volumes:
      - finskool-seed-flag:/data/seed
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:'+(process.env.PORT||3001)+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Notifications worker ───────────────────────────────────────────────────
  finskool-worker:
    image: finskool-backend:latest
    container_name: finskool-worker
    restart: unless-stopped
    env_file:
      - ../apps/backend/.env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      # SMTP_* comes from .env (env_file above) — see the note on finskool-backend.
    command: ["node", "dist/worker.js"]
    volumes:
      # Shares the same seed-flag volume as finskool-backend: the image's
      # ENTRYPOINT (docker-entrypoint.sh) runs `npm run db:seed` on first boot
      # if this flag is missing. finskool-backend always starts (and seeds)
      # first — this service depends on it being healthy — so by the time this
      # container starts, the flag already exists here and seeding is skipped.
      # Without this mount, seed.ts (which re-uploads cover images to MinIO on
      # every run, not fully idempotent) would re-run on every worker restart.
      - finskool-seed-flag:/data/seed
    depends_on:
      finskool-backend:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Cron (scheduled digests + stock close-price sweep) ────────────────────
  # A third standalone consumer of the same image: registers AND executes all
  # scheduled/cron work (subscription-expiry reminders, admin digests, the
  # daily stock close-price refresh) independent of finskool-backend and
  # finskool-worker — depends_on below only orders startup, it does not create
  # a runtime dependency, so this keeps running scheduled jobs even if either
  # of those two are stopped.
  finskool-cron:
    image: finskool-backend:latest
    container_name: finskool-cron
    restart: unless-stopped
    env_file:
      - ../apps/backend/.env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      # SMTP_* comes from .env (env_file above) — see the note on finskool-backend.
      # No MINIO_* overrides: cron.ts only reads/writes Postgres, sends email
      # via SMTP, and talks to Redis (BullMQ + the live-notification pubsub
      # channel) — none of its jobs touch file storage.
    command: ["node", "dist/cron.js"]
    volumes:
      # Shares the seed-flag volume with finskool-backend/finskool-worker —
      # see the comment on finskool-worker's volumes: above for why this
      # matters (avoids re-running seed.ts's non-idempotent MinIO re-uploads).
      - finskool-seed-flag:/data/seed
    depends_on:
      finskool-backend:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Frontend (Next.js) ─────────────────────────────────────────────────────
  finskool-frontend:
    build:
      context: ../apps/frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ""
    image: finskool-frontend:latest
    container_name: finskool-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ""
    depends_on:
      - finskool-backend

  # ── Mail (SMTP) ────────────────────────────────────────────────────────────
  # MailHog catches outbound SMTP traffic and shows it in a web UI — it does
  # NOT deliver mail to real inboxes. Swap SMTP_HOST/PORT (and add SMTP_USER/
  # SMTP_PASSWORD) in .env to point at a real relay (SES/SendGrid/Mailgun/etc.)
  # when real delivery to users' inboxes is needed.
  mailhog:
    image: mailhog/mailhog:latest
    container_name: finskool-mailhog
    restart: unless-stopped
    ports:
      - "8025:8025"   # web UI — view "sent" mail at http://<host>:8025

  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: finskool-postgres
    restart: unless-stopped
    env_file:
      - ../apps/backend/.env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - finskool-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: finskool-redis
    restart: unless-stopped
    env_file:
      - ../apps/backend/.env
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - finskool-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MinIO ──────────────────────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: finskool-minio
    restart: unless-stopped
    env_file:
      - ../apps/backend/.env
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    command: server /data --console-address ":9001"
    ports:
      # S3 API (9000) is NOT published here — nginx proxies it under /assets/ on the main
      # domain instead (see docker/nginx.conf), reachable internally via the "minio" service
      # name/network. Only the admin console stays directly exposed.
      - "${MINIO_CONSOLE_PORT:-9003}:9001" # MinIO web console
    volumes:
      - finskool-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MinIO bucket init (one-shot) ───────────────────────────────────────────
  minio-init:
    image: minio/mc:latest
    container_name: finskool-minio-init
    depends_on:
      minio:
        condition: service_healthy
    env_file:
      - ../apps/backend/.env
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY} ${MINIO_SECRET_KEY} &&
      mc mb -p local/${MINIO_BUCKET} &&
      mc anonymous set download local/${MINIO_BUCKET} &&
      echo 'minio bucket ${MINIO_BUCKET} ready'
      "
    restart: "no"

volumes:
  finskool-postgres-data:
    name: finskool-postgres-data
  finskool-redis-data:
    name: finskool-redis-data
  finskool-minio-data:
    name: finskool-minio-data
  finskool-seed-flag:
    name: finskool-seed-flag

networks:
  default: {}
  # Traefik's own compose project (/root/docker-compose.yml) has no explicit top-level
  # `networks:`, so its containers land on the implicit network named after that project
  # directory — root_default. Only the nginx service joins this network (see its
  # `networks:` list above); every other finskool-* service stays on `default` only.
  traefik-public:
    external: true
    name: root_default
